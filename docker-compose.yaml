services:
  rmbg:
    build:
      context: .
      dockerfile: Dockerfile
    image: rmbg-whitebg:v1.0.0
    container_name: rmbg
    volumes:
      # 模型权重放宿主机 ./resources，容器只读挂载，重建镜像不用重新下模型
      - ./resources:/app/resources:ro
    ports:
      - "6574:8000"
    environment:
      - MODEL_PATH=/app/resources/BiRefNet-HRSOD
      - PORT=8000
      - DEVICE=auto
    restart: always
    shm_size: 8g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
